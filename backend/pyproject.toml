[project]
name = "koi-backend"
version = "0.1.0"
description = "KOI - autonomous financial intelligence platform for Indian listed companies (backend)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "httpx>=0.27",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
